<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #991b1b; padding: 28px 32px; color: #fff; }
        .body { padding: 32px; line-height: 1.6; }
        .box { background: #fef2f2; border-radius: 8px; padding: 18px; margin: 20px 0; }
        .footer { background: #f4f4f5; padding: 20px 32px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1 style="margin:0;font-size:22px;">Return Rejected</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your return request has been rejected.</p>
        <div class="box">
            <p><strong>Order ID:</strong> <span th:text="${orderId}">ORD-001</span></p>
            <p th:if="${productName != null and !#strings.isEmpty(productName)}">
                <strong>Product:</strong> <span th:text="${productName}">Product</span>
            </p>
            <p th:if="${rejectionReason != null and !#strings.isEmpty(rejectionReason)}">
                <strong>Reason:</strong> <span th:text="${rejectionReason}">Reason</span>
            </p>
        </div>
        <p>Best regards,<br/><strong>The Marketplace Team</strong></p>
    </div>
    <div class="footer">Marketplace</div>
</div>
</body>
</html>
