<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #c2410c; padding: 28px 32px; color: #fff; }
        .body { padding: 32px; line-height: 1.6; }
        .otp { background: #fff7ed; border: 1px solid #fb923c; border-radius: 8px; padding: 18px; text-align: center; font-size: 32px; font-weight: 700; letter-spacing: 8px; }
        .footer { background: #f4f4f5; padding: 20px 32px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1 style="margin:0;font-size:22px;">Delivery OTP</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your order <strong th:text="${orderId}">ORD-001</strong> is out for delivery. Share this OTP only with the delivery partner after receiving your order.</p>
        <div class="otp" th:text="${otp}">123456</div>
        <p>This OTP expires in 24 hours.</p>
    </div>
    <div class="footer">Marketplace</div>
</div>
</body>
</html>
