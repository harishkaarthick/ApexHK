<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #166534; padding: 28px 32px; color: #fff; }
        .body { padding: 32px; line-height: 1.6; }
        .footer { background: #f4f4f5; padding: 20px 32px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1 style="margin:0;font-size:22px;">Order Delivered</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your order <strong th:text="${orderId}">ORD-001</strong> has been delivered successfully.</p>
        <p>You can raise a return request from your order history if there is an issue with the delivery.</p>
        <p>Thank you for shopping with us.<br/><strong>The Marketplace Team</strong></p>
    </div>
    <div class="footer">Marketplace</div>
</div>
</body>
</html>
