<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #0f766e; padding: 28px 32px; color: #fff; }
        .body { padding: 32px; line-height: 1.6; }
        .amount { background: #ecfdf5; border-radius: 8px; padding: 18px; margin: 20px 0; font-size: 22px; font-weight: 700; }
        .footer { background: #f4f4f5; padding: 20px 32px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1 style="margin:0;font-size:22px;">Refund Processed</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your refund has been processed.</p>
        <div class="amount">Rs. <span th:text="${amount}">0.00</span></div>
        <p>Best regards,<br/><strong>The Marketplace Team</strong></p>
    </div>
    <div class="footer">Marketplace</div>
</div>
</body>
</html>
