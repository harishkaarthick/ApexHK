<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f5; margin: 0; padding: 0; color: #333; }
        .wrapper { max-width: 600px; margin: 32px auto; background: #fff; border-radius: 8px; overflow: hidden; }
        .header { background: #ea580c; padding: 28px 32px; color: #fff; }
        .body { padding: 32px; line-height: 1.6; }
        .tracking { background: #fff7ed; border: 1px solid #fb923c; border-radius: 8px; padding: 18px; margin: 20px 0; }
        .footer { background: #f4f4f5; padding: 20px 32px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1 style="margin:0;font-size:22px;">Out For Delivery</h1>
    </div>
    <div class="body">
        <h2>Hi <span th:text="${customerName}">Customer</span>,</h2>
        <p>Your order <strong th:text="${orderId}">ORD-001</strong> is out for delivery.</p>
        <div class="tracking" th:if="${trackingId != null and !#strings.isEmpty(trackingId)}">
            <p style="margin:0 0 8px;"><strong>Tracking ID</strong></p>
            <p style="margin:0;font-size:20px;" th:text="${trackingId}">TRACK123</p>
        </div>
        <p>Your delivery OTP has been sent in a separate email.</p>
        <p>Best regards,<br/><strong>The Marketplace Team</strong></p>
    </div>
    <div class="footer">Marketplace</div>
</div>
</body>
</html>
