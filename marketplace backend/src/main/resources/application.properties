spring.application.name=marketplace-api
spring.config.import=optional:file:.env[.properties]

server.port=8080
server.servlet.context-path=/

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/marketplace}
# L-3: Disabled — explicit index management via MongoIndexConfig is used instead.
# auto-index-creation adds startup latency and is not recommended for production.
spring.data.mongodb.auto-index-creation=false

# JWT
# DEV DEFAULT: override JWT_SECRET with a strong random value in production

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiry=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-expiry=${JWT_REFRESH_EXPIRY:604800000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Frontend URL (used for email verification links)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Razorpay
# SECURITY FIX §4.9: no hardcoded fallbacks — both keys must come from env vars.
# Rotate both in the Razorpay dashboard if this repo was ever externally accessible.
# Required: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
# L-2: INFO for production. Override to DEBUG in application-dev.properties.
logging.level.com.marketplace=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
